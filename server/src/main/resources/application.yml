server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: omni-data-panel
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:192.168.3.10}
      port: ${REDIS_PORT:40782}
      password: ${REDIS_PASSWORD:123456}
      timeout: 2s
      connect-timeout: 2s
  quartz:
    job-store-type: memory
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

omni:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration: ${JWT_EXPIRATION:8h}
    initial-admin-password: ${ADMIN_INITIAL_PASSWORD:}
  crypto:
    master-key: ${CREDENTIAL_MASTER_KEY:}
  query:
    timeout-seconds: ${QUERY_TIMEOUT_SECONDS:30}
    max-rows: ${QUERY_MAX_ROWS:1000}
    per-user-concurrency: ${QUERY_USER_CONCURRENCY:3}
    per-source-concurrency: ${QUERY_SOURCE_CONCURRENCY:5}
    redis-result-limit-bytes: ${QUERY_REDIS_RESULT_LIMIT_BYTES:524288}
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:omni-exports}
  subscription:
    from: ${MAIL_FROM:}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    pdf-enabled: ${SUBSCRIPTION_PDF_ENABLED:true}
    pdf-timeout-ms: ${SUBSCRIPTION_PDF_TIMEOUT_MS:90000}
