server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: omni-data-panel
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:192.168.3.10}
      port: ${REDIS_PORT:40782}
      password: ${REDIS_PASSWORD:123456}
      timeout: 2s
      connect-timeout: 2s
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 20000
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # SMTP 常未配置或非就绪依赖；邮件连通性由设置页测试发送验证，不参与探针
    mail:
      enabled: false
  metrics:
    tags:
      application: omni-data-panel

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n"

omni:
  observability:
    metrics-token: ${OMNI_METRICS_TOKEN:}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration: ${JWT_EXPIRATION:8h}
    initial-admin-password: ${ADMIN_INITIAL_PASSWORD:}
    # 可信反向代理 CIDR/IP（逗号分隔）；空则忽略 X-Forwarded-For / X-Real-IP
    trusted-proxies: ${TRUSTED_PROXIES:}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:30}
      public-per-minute: ${RATE_LIMIT_PUBLIC_PER_MINUTE:120}
      embed-per-minute: ${RATE_LIMIT_EMBED_PER_MINUTE:180}
    oidc:
      enabled: ${OIDC_ENABLED:false}
      issuer-uri: ${OIDC_ISSUER_URI:}
      client-id: ${OIDC_CLIENT_ID:}
      client-secret: ${OIDC_CLIENT_SECRET:}
      client-name: ${OIDC_CLIENT_NAME:企业登录}
      default-role-code: ${OIDC_DEFAULT_ROLE_CODE:USER}
      frontend-redirect-uri: ${OIDC_FRONTEND_REDIRECT_URI:}
  crypto:
    master-key: ${CREDENTIAL_MASTER_KEY:}
  query:
    timeout-seconds: ${QUERY_TIMEOUT_SECONDS:30}
    max-rows: ${QUERY_MAX_ROWS:1000}
    # 仪表盘按波次并行；用户并发宜大于单看板卡片数，避免互相挤占
    per-user-concurrency: ${QUERY_USER_CONCURRENCY:16}
    per-source-concurrency: ${QUERY_SOURCE_CONCURRENCY:8}
    redis-result-limit-bytes: ${QUERY_REDIS_RESULT_LIMIT_BYTES:524288}
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:omni-exports}
  subscription:
    from: ${MAIL_FROM:}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    pdf-enabled: ${SUBSCRIPTION_PDF_ENABLED:true}
    pdf-timeout-ms: ${SUBSCRIPTION_PDF_TIMEOUT_MS:90000}
