# 刮取 Omni Data Panel 指标（示例片段，合并进你的 prometheus.yml）
scrape_configs:
  - job_name: omni-data-panel
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    authorization:
      type: Bearer
      credentials: "<替换为 OMNI_METRICS_TOKEN>"
    # 若使用自定义头：
    # headers:
    #   X-Metrics-Token: "<替换为 OMNI_METRICS_TOKEN>"
    static_configs:
      - targets:
          - "server:8080"   # Compose 内网服务名；宿主机刮取可用 localhost:8080
        labels:
          service: omni-data-panel
