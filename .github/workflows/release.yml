name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/omnisynth/omni-data-panel-server
  WEB_IMAGE: ghcr.io/omnisynth/omni-data-panel-web

jobs:
  release:
    name: build-push-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "zip_name=omni-data-panel-${TAG}-compose.zip" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Assemble compose package
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          OUT="dist/omni-data-panel-${TAG}"
          mkdir -p "$OUT"
          cp deploy/compose.yml "$OUT/"
          cp deploy/start.ps1 deploy/stop.ps1 "$OUT/"
          cp deploy/start.sh deploy/stop.sh "$OUT/"
          cp deploy/README.md "$OUT/"
          chmod +x "$OUT/start.sh" "$OUT/stop.sh"

          {
            echo "# Omni Data Panel ${TAG} — 首次部署前必须替换所有密码和密钥。"
            echo "# 生产核对：https://github.com/OmniSynth/omni-data-panel/blob/main/docs/production.md"
            echo ""
            echo "OMNI_SERVER_IMAGE=${SERVER_IMAGE}:${TAG}"
            echo "OMNI_WEB_IMAGE=${WEB_IMAGE}:${TAG}"
            echo ""
            awk '
              /^OMNI_SERVER_IMAGE=/ { next }
              /^OMNI_WEB_IMAGE=/ { next }
              /^# 仅供本地开发/ { next }
              /^# 生产核对清单/ { next }
              /^#$/ { next }
              /^# Release 一键包/ { next }
              { print }
            ' deploy/.env.example
          } > "$OUT/.env.example"

          printf '%s\n' \
            "# 快速开始（${TAG}）" \
            "" \
            "1. 复制 \`.env.example\` 为 \`.env\`，替换全部密码与密钥。" \
            "2. Windows: \`.\\start.ps1\`；Linux/macOS: \`./start.sh\`" \
            "3. 浏览器打开 http://localhost ，账号 \`admin\` / \`.env\` 中 \`ADMIN_INITIAL_PASSWORD\`" \
            "" \
            "详细说明见 \`README.md\`。" \
            > "$OUT/QUICKSTART.md"

          (cd dist && zip -r "${{ steps.ver.outputs.zip_name }}" "omni-data-panel-${TAG}")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Omni Data Panel ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            ## 一键部署

            1. 下载附件 `${{ steps.ver.outputs.zip_name }}` 并解压
            2. 复制 `.env.example` → `.env`，替换全部密码与密钥
            3. Windows 运行 `.\start.ps1`，Linux/macOS 运行 `./start.sh`
            4. 浏览器打开 http://localhost （账号 `admin` / `.env` 中 `ADMIN_INITIAL_PASSWORD`）

            预构建镜像：

            - `${{ env.SERVER_IMAGE }}:${{ steps.ver.outputs.tag }}`
            - `${{ env.WEB_IMAGE }}:${{ steps.ver.outputs.tag }}`

            需 Docker Engine 24+ 与 Compose v2。首次请确保 GHCR 包为 Public，或先 `docker login ghcr.io`。
          files: |
            dist/${{ steps.ver.outputs.zip_name }}
